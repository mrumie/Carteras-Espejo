:root{
  --font:'Aller','Fira Sans','Segoe UI',Helvetica,Arial,sans-serif;
  --mfo-green:#7BC143; --mfo-coral:#E07F5C; --mfo-dark:#1B2127; --mfo-blue-mid:#5D7082;
  --mfo-gray-mid:#969696; --mfo-gray-bg:#EFEFEF; --mfo-gray-hover:#E0E0E0;
  --bg:#FFFFFF; --surface:#FFFFFF; --fg:var(--mfo-dark); --muted:var(--mfo-gray-mid);
  --ok:#4E8E22; --bad:#C2502C; --badge:var(--mfo-coral);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14191E; --surface:#1A2026; --fg:#E4E8EB; --muted:#9AA3AB;
    --mfo-gray-bg:#252C33; --mfo-gray-hover:#323A42; --ok:#8BCB55; --bad:#EE906E; --badge:#EE906E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14191E; --surface:#1A2026; --fg:#E4E8EB; --muted:#9AA3AB;
  --mfo-gray-bg:#252C33; --mfo-gray-hover:#323A42; --ok:#8BCB55; --bad:#EE906E; --badge:#EE906E;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
body{font-family:var(--font);font-weight:300;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding:1.5rem}
button,input{font-family:var(--font)}
:focus-visible{outline:2px solid var(--mfo-green);outline-offset:2px}
[hidden]{display:none !important}

/* Encabezado tipo widget */
.widget-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:1rem}
.widget-title{font-size:22px;font-weight:700;color:var(--fg);line-height:1.2}
.widget-sub{font-size:14px;font-weight:300;color:var(--fg);margin-top:2px}
.widget-date{font-size:11.5px;color:var(--muted);margin-top:4px}
.widget-badge{text-align:right}
.solo-uso{font-size:12px;font-weight:700;color:var(--badge);text-transform:uppercase;letter-spacing:.06em}
.badge-actions{margin-top:8px}

/* Botones */
.mfo-btn{font-size:13px;font-weight:700;padding:7px 20px;border-radius:4px;border:1.5px solid var(--mfo-gray-mid);background:transparent;color:var(--mfo-blue-mid);cursor:pointer;transition:all .15s;white-space:nowrap}
.mfo-btn:hover{border-color:var(--mfo-blue-mid);color:var(--fg)}
.mfo-btn.small{font-size:11px;padding:5px 12px;color:var(--muted)}
.mfo-btn.small:hover{color:var(--mfo-blue-mid)}
.mfo-btn.primary{background:var(--mfo-green);border-color:var(--mfo-green);color:#fff}
.mfo-btn:disabled{opacity:.35;cursor:not-allowed}
.mfo-btn.primary:disabled{background:transparent;border-style:dashed;border-color:var(--mfo-gray-mid);color:var(--mfo-gray-mid);opacity:.6;cursor:not-allowed}

/* Tarjetas */
.item{border-radius:6px;overflow:hidden;margin-bottom:24px}
.item-header{padding:12px 22px;background:#E4E4E4;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.item-title{font-size:14px;font-weight:700;color:var(--fg)}
.item-date{font-size:11px;color:var(--muted)}
.item-body{padding:14px 22px 16px;background:var(--surface);border:1px solid var(--mfo-gray-bg);border-top:none;border-radius:0 0 6px 6px}

/* Carga */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:6px}
.slots .item{margin:0;transition:box-shadow .15s}
.slot.drag .item-body{box-shadow:inset 0 0 0 2px var(--mfo-green)}
.slot.ok .item-header{box-shadow:inset 4px 0 0 var(--mfo-green)}
.slot.err .item-header{box-shadow:inset 4px 0 0 var(--mfo-coral)}
.slot .desc{font-size:13px;font-weight:300;margin-bottom:12px}
.pick{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pick input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.pick input[type=file]:focus-visible + label{outline:2px solid var(--mfo-green);outline-offset:2px}
.pick label.mfo-btn{display:inline-block}
.pick span{font-size:11.5px;color:var(--muted)}
.status{font-size:12.5px;font-weight:400;min-height:1.5em;margin-top:10px}
.status.ok{color:var(--ok)}
.status.err{color:var(--bad)}
.status b{font-weight:700}
.actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:14px}
.note{font-size:11.5px;color:var(--muted)}
.placeholder{font-size:13px;color:var(--muted);padding:6px 0}
/* Selector de cliente (nombres ocultos hasta abrirlo) */
.toolbar{display:flex;align-items:center;gap:10px;margin:2px 0 18px}
.sel{position:relative}
.sel-btn{display:inline-flex;align-items:center;gap:8px;letter-spacing:.06em;text-transform:uppercase}
.sel-btn svg{transition:transform .15s}
.sel-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.sel-btn.is-set{background:var(--mfo-blue-mid);border-color:var(--mfo-blue-mid);color:#fff}
.menu{position:absolute;left:0;top:calc(100% + 6px);z-index:5;display:flex;flex-direction:column;gap:6px;min-width:190px;padding:8px;background:var(--surface);border:1px solid var(--mfo-gray-hover);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.menu .mfo-btn{text-align:left;letter-spacing:.06em}
.pdf-btn{margin-left:auto;font-size:11.5px;padding:6px 16px;border-color:#B3D88C;color:#5D7082}
.pdf-btn:hover{background:#E1F1D3;color:var(--fg)}
.opc-btn{font-size:11.5px;padding:6px 14px;letter-spacing:.04em;border-style:dashed}
.opc-btn.is-on{border-style:solid;border-color:#5D7082;background:#EEF1F4;color:#5D7082}
.menu .ocultar{font-family:var(--font);font-size:12px;font-weight:300;text-align:left;padding:6px 12px 2px;border:0;border-top:1px solid var(--mfo-gray-hover);background:none;color:var(--muted);cursor:pointer}
.menu .ocultar:hover{color:var(--fg)}
.cli-info{font-size:12.5px;font-weight:400}
/* Tablas (paleta y pesos de la norma gráfica MFO) */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.r{border-collapse:collapse;table-layout:fixed;font-size:12px;font-weight:300;font-variant-numeric:tabular-nums;color:var(--fg)}
table.r th,table.r td{padding:3px 8px;white-space:nowrap;text-align:center}
table.r .lab{text-align:left;overflow:hidden;text-overflow:ellipsis}
/* en las filas Total Cartera, las celdas vacías van sin color (los subtotales grises se mantienen completos) */
table.r tr.big td:empty{background:transparent}
.cu-btn{margin-bottom:12px}
table.r thead th.cu-h{background:#969696}
table.r td.cu-nom,table.r td.cu-mon{text-align:center;padding-left:2px !important;padding-right:2px !important}
table.r thead th.cu-nom,table.r thead th.cu-mon{padding-left:0;padding-right:0;text-align:center}
table.r tr.sub td.cu,table.r tr.big td.cu,table.r tr.mm-grupo td.cu{background:transparent}
.nota-pie{font-size:11px;color:var(--muted);margin-top:12px}
/* Money market agrupado: fila resumen con botón y detalle desplegable con sangría */
.mm-toggle{appearance:none;border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.mm-toggle:hover{color:var(--mfo-blue-mid)}
/* puntito verde fuera de la tabla que indica que Money Market se puede desagrupar (hueco cuando está abierto) */
.scroll{padding-left:18px;margin-left:-18px}
table.r tr.mm-grupo td.lab{overflow:visible;position:relative}
.mm-toggle::before{content:'';position:absolute;left:-11px;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:var(--fg)}
.mm-toggle[aria-expanded="true"]::before{background:transparent;box-shadow:inset 0 0 0 1px var(--fg)}
.mm-toggle .mm-n{color:var(--muted)}
table.r tr.mm-det td.lab{padding-left:20px}
table.r .gl{border-left:4px solid var(--surface) !important}
table.r tbody td:not(.lab){padding-left:5px;padding-right:5px}
table.r.angosta tbody td:not(.lab){padding-left:3px;padding-right:3px}
table.r.angosta thead tr:not(.g) th{padding-left:3px;padding-right:3px}
table.r.prod tbody td.lab{white-space:normal;line-height:1.2}
table.r thead th{background:#5D7082;color:#fff;font-weight:700;font-size:10.5px;padding:3px 6px;line-height:1.15;border-left:0;letter-spacing:.02em}
table.r thead th:first-child{border-left:0}
table.r thead tr.g th{font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;height:18px}
/* línea que separa MONTO / % CARTERA de los nombres de los alias */
table.r thead tr.g th:not(.lab):not(.lim){border-bottom:1px solid rgba(255,255,255,.55)}
/* misma altura de encabezado en todos los clientes (alias en 1 o 2 líneas) */
table.r thead tr:not(.g) th{height:27px;padding:2px 6px;line-height:1.08;vertical-align:middle}
table.r thead th.pc{background:#8497B0}
table.r thead th.lim{background:#E07F5C;padding-left:3px;padding-right:3px;overflow:hidden}
table.r tbody td{border-bottom:0}
table.r td.g0{border-left:0}
table.r tr.sub td{background:#EBEBEB;font-weight:700}
table.r tr.big td{background:#D6DCE2;font-weight:700}
table.r tr.big td.lim,table.r tr.big td.vacio{background:transparent}
table.r tr.sep td{border-top:2px dotted #5D7082}
table.r tr.gap td{height:10px;padding:0;border:0;background:transparent}
table.r td.lim{background:#FBE5DB;color:var(--mfo-dark);font-weight:700}
table.r td.lim.vacio{background:transparent}
table.r tr.sub td.lim{background:transparent}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) table.r td.lim:not(.vacio){background:#4A2E25;color:#EAA992}}
:root[data-theme="dark"] table.r td.lim:not(.vacio){background:#4A2E25;color:#EAA992}
/* Allocation MFO en verde (norma: verde base en el encabezado, verde fondo #E1F1D3 en las celdas) para distinguirla del límite neutral naranjo */
table.r thead th.lim.alloc{background:#7BC143}
table.r td.lim.alloc{background:#E1F1D3;color:var(--mfo-dark)}
table.r td.lim.alloc.vacio,table.r tr.sub td.lim.alloc,table.r tr.big td.lim.alloc{background:transparent}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) table.r td.lim.alloc:not(.vacio){background:#2E4220;color:#B3D88C}}
:root[data-theme="dark"] table.r td.lim.alloc:not(.vacio){background:#2E4220;color:#B3D88C}
.cli-info b{font-weight:700}
.cli-info.err{color:var(--bad)}
</style>
</head>

<main class="wrap">

  <div id="upload">
    <div class="widget-header">
      <div>
        <h1 class="widget-title">Control Carteras Espejo</h1>
        <div class="widget-sub">Carga el archivo de descarga Asset Allocation.</div>
      </div>
      <div class="widget-badge"><div class="solo-uso">Solo uso interno</div></div>
    </div>
    <div class="slots">
      <div class="slot" id="slot-aa">
        <div class="item">
          <div class="item-header"><span class="item-title">Allocation</span><span class="item-date">Descarga Asset Allocation</span></div>
          <div class="item-body">
            <p class="desc">Detalle de posiciones en CLP y USD.</p>
            <div class="pick">
              <input type="file" id="f-aa" accept=".xlsx,.xls,.xlsm">
              <label for="f-aa" class="mfo-btn">Elegir archivo</label><span>o arrástralo aquí</span>
            </div>
            <div class="status" id="s-aa" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="mfo-btn primary" id="go" disabled>Ver Cuentas Espejo</button>
      <span class="note">El archivo se lee en tu navegador; no se envía a ningún servidor.</span>
    </div>
  </div>

  <div id="dash" hidden>
    <div class="widget-header">
      <div>
        <h1 class="widget-title">Control Carteras Espejo</h1>
        <div class="widget-date" id="d-date"></div>
      </div>
      <div class="widget-badge">
        <div class="solo-uso">Solo uso interno</div>
      </div>
    </div>
    <div class="toolbar">
      <div class="sel" id="selector">
        <button type="button" class="mfo-btn sel-btn" id="sel-btn" aria-haspopup="true" aria-expanded="false"><span id="sel-txt">Cliente</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg></button>
        <div class="menu" id="sel-menu" role="menu" hidden>
          <button type="button" class="mfo-btn" role="menuitem" data-cliente="buneder">BUNEDER</button>
          <button type="button" class="mfo-btn" role="menuitem" data-cliente="fantoni">FANTONI</button>
          <button type="button" class="mfo-btn" role="menuitem" data-cliente="flano">FLAÑO</button>
          <button type="button" class="mfo-btn" role="menuitem" data-cliente="montero">MONTERO</button>
          <button type="button" class="ocultar" role="menuitem" data-cliente="">Ocultar cliente</button>
        </div>
      </div>
      <button type="button" class="mfo-btn opc-btn" id="opc-btn" aria-pressed="false" hidden></button>
      <button type="button" class="mfo-btn pdf-btn" id="pdf-btn" hidden>PDF</button>
    </div>
    <div id="vista"></div>
  </div>

</main>

<script>
"use strict";
// ================= Lectura del Asset Allocation (todo en el navegador) =================
const COLS = ['Alias', 'Nombre Cliente', 'Clase Activo', 'Sub Tipo Instrumento', 'Región', 'Moneda Riesgo', 'Tipo Instrumento', 'Nombre', 'Valor en CLP', 'Valor en USD', 'Fecha'];
let archivo = null, datos = null;

const $ = (id) => document.getElementById(id);
const slot = $('slot-aa'), st = $('s-aa');
function estado(cls, html) { slot.classList.remove('ok', 'err'); if (cls) slot.classList.add(cls); st.className = 'status ' + (cls || ''); st.innerHTML = html; }

function abrir(bytes) {
  return XLSX.read(bytes, { type: 'array', cellDates: true });
}

function leerAA(wb) {
  for (const nombre of wb.SheetNames) {
    const filas = XLSX.utils.sheet_to_json(wb.Sheets[nombre], { header: 1, raw: true, defval: null });
    const hi = filas.findIndex((f) => f && f.includes('Alias') && f.includes('Clase Activo'));
    if (hi < 0) continue;
    const cab = filas[hi];
    const falta = COLS.filter((c) => !cab.includes(c));
    if (falta.length) throw new Error('faltan columnas: ' + falta.join(', '));
    const ix = Object.fromEntries(COLS.map((c) => [c, cab.indexOf(c)]));
    const ixCust = cab.indexOf('Manager'); // custodio (opcional)
    const pos = [];
    for (const f of filas.slice(hi + 1)) {
      if (!f || !f[ix['Alias']]) continue;
      const o = {}; for (const c of COLS) o[c] = f[ix[c]];
      o['Manager'] = ixCust >= 0 ? f[ixCust] : '';
      pos.push(o);
    }
    if (!pos.length) throw new Error('la hoja no tiene posiciones');
    const aFecha = (v) => {
      if (v instanceof Date) return v;
      if (typeof v === 'number') return new Date(Math.round((v - 25569) * 864e5));
      const m = String(v || '').match(/(\d{4})-(\d{2})-(\d{2})|(\d{2})[-\/](\d{2})[-\/](\d{4})/);
      if (!m) return null;
      return m[1] ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(+m[6], +m[5] - 1, +m[4]);
    };
    const fechas = pos.map((p) => aFecha(p['Fecha'])).filter((d) => d && !isNaN(d)).sort((a, b) => b - a);
    return { hoja: nombre, posiciones: pos, alias: new Set(pos.map((p) => p['Alias'])).size, fecha: fechas[0] || null };
  }
  throw new Error('no se encontró la tabla de posiciones (columnas Alias y Clase Activo)');
}

const fmtFecha = (d) => d ? d.toLocaleDateString('es-CL', { day: '2-digit', month: '2-digit', year: 'numeric' }) : 's/f';
const nf = new Intl.NumberFormat('es-CL');

async function procesar() {
  datos = null; $('go').disabled = true;
  estado('', 'Leyendo <b>' + archivo.name + '</b>…');
  try {
    const bytes = new Uint8Array(await archivo.arrayBuffer());
    const wb = abrir(bytes);
    datos = leerAA(wb);
    estado('ok', '✓ <b>' + archivo.name + '</b> · datos al ' + fmtFecha(datos.fecha));
    $('go').disabled = false;
  } catch (e) {
    estado('err', 'No pude leer el archivo: ' + (e.message || e) + '.');
  }
}

function elegir(f) { if (!f) return; archivo = f; procesar(); }
$('f-aa').addEventListener('change', (e) => elegir(e.target.files[0]));
const caja = slot.querySelector('.item');
caja.addEventListener('dragover', (e) => { e.preventDefault(); slot.classList.add('drag'); });
caja.addEventListener('dragleave', () => slot.classList.remove('drag'));
caja.addEventListener('drop', (e) => { e.preventDefault(); slot.classList.remove('drag'); elegir(e.dataTransfer.files[0]); });

$('go').addEventListener('click', () => {
  if (!datos) return;
  $('d-date').textContent = 'Asset Allocation al ' + fmtFecha(datos.fecha);
  elegirCliente('');
  $('upload').hidden = true; $('dash').hidden = false; window.scrollTo(0, 0);
});
// ================= Clientes =================
const CLIENTES = {
  // BUNEDER: solo personas naturales (se excluyen sociedades del mismo alias, como Inversiones Magnolia SpA)
  buneder: { nombre: 'BUNEDER', alias: ['BUN-PATRICIA', 'BUN-NICOLE', 'BUN-CAROLINA'], soloNaturales: true,
    limite: { RF: 0.65, RV: 0.30, ALT: 0.05, USD: 0.70, CLP: 0.30 } },
  // FANTONI-JOSETOMAS va agrupado (oculto) al abrir; con el botón se incorpora a todas las tablas
  fantoni: { nombre: 'FANTONI', alias: ['FANTONI-CRESCENTE', 'FANTONI-LAURA', 'FANTONI-MATEO', 'FANTONI-JOSETOMAS'], opcional: ['FANTONI-JOSETOMAS'],
    limite: { RF: 0.45, RV: 0.50, ALT: 0.05, USD: 0.75, CLP: 0.25 } },
  flano: { nombre: 'FLAÑO', alias: ['CFLAÑO', 'JFLAÑO', 'PFLAÑO'],
    limite: { RF: 0.55, RV: 0.30, ALT: 0.15, USD: 0.50, CLP: 0.50 } },
  // MONTERO: los 4 hijos están en un solo alias (AMONTERO-H); cada columna toma las posiciones del titular
  // ("Nombre Cliente") que coincide. MONTERO-ALEJANDRO va agrupado (oculto) al abrir, como José Tomás en FANTONI.
  montero: { nombre: 'MONTERO', alias: ['MONTERO-MILAGROS', 'MONTERO-ANA', 'MONTERO-JUAN DIEGO', 'MONTERO-ALEJANDRO'], opcional: ['MONTERO-ALEJANDRO'],
    filtros: {
      'MONTERO-ALEJANDRO': { alias: 'AMONTERO-H', titular: /\bAlejandro\b/i },
      'MONTERO-MILAGROS': { alias: 'AMONTERO-H', titular: /\bMilagros\b/i },
      'MONTERO-ANA': { alias: 'AMONTERO-H', titular: /^\s*Ana\b/i },
      'MONTERO-JUAN DIEGO': { alias: 'AMONTERO-H', titular: /\bJuan\s+Diego\b/i },
    },
    limite: { RF: 0.40, RV: 0.40, ALT: 0.20, USD: 0.50, CLP: 0.50 } },
};
// ¿la posición p pertenece a la columna a del cliente c? (alias directo, o alias + nombre del titular)
const deColumna = (c, a, p) => { const fl = c.filtros && c.filtros[a]; return fl ? p['Alias'] === fl.alias && fl.titular.test(String(p['Nombre Cliente'] || '')) : p['Alias'] === a; };
const esSociedad = (t) => /\b(SpA|S\.A\.?|Ltda\.?|Limitada|Inversiones)\b/i.test(t || '');
// Clase de cada posición: la caja va a renta fija de su mercado; CLP = clases nacionales, USD = internacionales
function clasificar(p) {
  const ca = String(p['Clase Activo'] || '');
  // Pershing Square Holdings se trata como acción de renta variable internacional (EE.UU.), aunque el AA lo traiga en ALTI
  const pershing = /Pershing Square Holdings/i.test(String(p['Nombre'] || ''));
  if (pershing) p = { ...p, 'Clase Activo': 'RVI', 'Región': 'Norteamérica', 'Tipo Instrumento': 'Acciones' };
  const clase = { CASHI: 'RFI', CASHN: 'RFN' }[pershing ? 'RVI' : ca] || (pershing ? 'RVI' : ca);
  const sub = String(p['Sub Tipo Instrumento'] || '');
  let grupo;
  if (clase === 'RFN') grupo = p['Moneda Riesgo'] === 'UF' ? 'UF' : 'CLP';

const OTRO_GLOBAL = { 'Estados Unidos': 0.68, 'Europa': 0.11, 'Japón': 0.05, 'Global Emergente': 0.16 }; // fondo global sin peso cargado: se usa el de un ACWI

  const tb = el('tbody');

    const tr = el('tr', { class: [opts.total ? 'sub' : '', opts.big ? 'big' : ''].join(' ').trim() });
    tr.appendChild(el('td', { class: 'lab' }, etq));

  ['RFN', 'RVN', 'ALTN', 'RFI', 'RVI', 'ALTI'].forEach((cl, ci) => {

      }

// Resumen por productos: un producto por fila, ordenados por clase (RF → RV → ALT) y, dentro de cada clase, por subclase
// (en RFI: caja primero, luego money market, short duration, high grade…); dentro de la subclase, de mayor a menor monto.

function tablaProductos(c, porAlias, nacional) {

  t.appendChild(cg); t.style.width = (100 * suma / conLim).toFixed(3) + '%'; t.style.minWidth = suma + 'px';
  const th = el('thead'); const g = el('tr', { class: 'g' });
  g.append(el('th', { class: 'lab', rowspan: '2' }, nacional ? 'Cartera Nacional' : 'Cartera Internacional'), (() => { const x = el('th', { colspan: String(n) }); x.innerHTML = 'Monto (' + (nacional ? 'CLP' : 'USD') + ')'; return x; })(), el('th', { class: 'pc', colspan: String(n) }, '% Cartera'));
  const h = el('tr');
  const nombre = (a, cls) => { const x = el('th', { class: cls }); const i = a.indexOf('-'); if (i > 0) { x.append(a.slice(0, i + 1)); x.appendChild(el('br')); x.append(a.slice(i + 1)); } else x.textContent = a; return x; };
  c.alias.forEach((a) => h.appendChild(nombre(a, '')));
  c.alias.forEach((a) => h.appendChild(nombre(a, 'pc')));
  th.append(g, h); t.appendChild(th);
  const tb = el('tbody');
  const gap = () => { const tr = el('tr', { class: 'gap' }); tr.appendChild(el('td', { colspan: String(2 * n + 1) })); tb.appendChild(tr); };
  gap();
  let hubo = false;
  clases.forEach((cl, ci) => {
    const todos = porAlias.flat().filter((r) => r.clase === cl);
    if (!todos.length) return;
    if (hubo) gap(); // espacio entre clases, como en Resumen por Clase de Activo
    hubo = true;
    const og = ORDEN[cl] || [];
    const pos = (gr) => { const i = og.indexOf(gr); return i < 0 ? 99 : i; };
    const usdDe = (nm) => todos.filter((r) => r.instrumento === nm).reduce((s2, r) => s2 + r.usd, 0);
    const grupoDe = (nm) => todos.find((r) => r.instrumento === nm).grupo;
    const cajaDe = (nm) => (todos.some((r) => r.instrumento === nm && r.caja) ? 0 : 1);
    // dentro de caja y money market: caja, luego depósitos/fiduciarios, luego cuentas "Cash", luego fondos money market
    const rango = (nm) => (cajaDe(nm) === 0 ? 0 : /Fiduciario|Dep[oó]sito/i.test(nm) ? 1 : /Cash/i.test(nm) ? 2 : 3);
    // en renta fija nacional: caja, luego fondos money market, luego UF y después nominales (CLP)
    const mmNac = (nm) => (cl === 'RFN' && cajaDe(nm) !== 0 && todos.some((r) => r.instrumento === nm && r.mm) ? 0 : 1);
    // en renta variable internacional: primero los fondos (por región), después las acciones de mayor a menor monto

    const nombres = [...new Set(todos.map((r) => r.instrumento))]
      .sort((a, b) => accionDe(a) - accionDe(b) || (accionDe(a) && usdDe(b) - usdDe(a)) || cajaDe(a) - cajaDe(b) || mmNac(a) - mmNac(b) || pos(grupoDe(a)) - pos(grupoDe(b)) || grupoDe(a).localeCompare(grupoDe(b)) || rango(a) - rango(b) || usdDe(b) - usdDe(a));
    // Money market (caja, depósitos y fondos de liquidez): si hay más de 2 productos, van agrupados en una fila
    // "Money Market" con su total, y se pueden desplegar para ver el detalle
    const montoNm = (nm) => porAlias.map((rs) => rs.filter((r) => r.clase === cl && r.instrumento === nm).reduce((s2, r) => s2 + r[campo], 0));
    const esMM = (nm) => (cl === 'RFI' && grupoDe(nm) === 'Caja y Money Market') || (cl === 'RFN' && (cajaDe(nm) === 0 || mmNac(nm) === 0));
    // no se muestran instrumentos con valor menor a USD 20 en todos los alias (p. ej. bonos en default con valor residual)
    const usdNm = (nm) => porAlias.map((rs) => rs.filter((r) => r.clase === cl && r.instrumento === nm).reduce((s2, r) => s2 + r.usd, 0));
    const visible = (nm) => usdNm(nm).some((x) => Math.abs(x) >= 20);
    const mmNombres = nombres.filter((nm) => esMM(nm) && visible(nm));
    const agrupar = mmNombres.length > 2;
    const claveMM = cliente + '|' + cl;
    let filaMM = null;
    for (const nm of nombres) {
      const m = montoNm(nm);
      if (!visible(nm)) continue;
      const u = porAlias.map((rs) => rs.filter((r) => r.clase === cl && r.instrumento === nm).reduce((s2, r) => s2 + r.usd, 0));

        mt.forEach((x) => filaMM.appendChild(el('td', {}, money(x))));

        tb.appendChild(filaMM);

      let partes = [null];
      if (verCustodio) {
        const porCu = new Map();
        porAlias.forEach((rs) => rs.filter((r) => r.clase === cl && r.instrumento === nm).forEach((r) => { const k = custodioCorto(r.custodio); porCu.set(k, (porCu.get(k) || 0) + r.usd); }));
        const cus = [...porCu.entries()].filter(([, x]) => Math.abs(x) >= 20).sort((a, b) => b[1] - a[1]).map(([k]) => k);
        if (cus.length > 1) partes = cus;
      }
      for (const cu of partes) {
        const filtro = (r) => r.clase === cl && r.instrumento === nm && (cu === null || custodioCorto(r.custodio) === cu);
        const mc = cu === null ? m : porAlias.map((rs) => rs.filter(filtro).reduce((s2, r) => s2 + r[campo], 0));
        const uc = cu === null ? u : porAlias.map((rs) => rs.filter(filtro).reduce((s2, r) => s2 + r.usd, 0));
        const tr = el('tr'); tr.dataset.nm = nm; tr.dataset.cl = cl; if (cu !== null) tr.dataset.cu = cu;
        if (agrupar && esMM(nm)) { tr.className = 'mm-det'; tr.dataset.mm = cl; tr.hidden = !mmAbierto.has(claveMM); }
        tr.appendChild(el('td', { class: 'lab', title: nm }, nm.replace(/\(UNICA\)/g, '(Unica)'))); // serie única en minúsculas para que el nombre quepa
        mc.forEach((x) => tr.appendChild(el('td', {}, money(x))));
        uc.forEach((x, i) => tr.appendChild(el('td', {}, Math.round(mc[i]) ? pct(totUsd[i] ? x / totUsd[i] : 0) : '')));
        tb.appendChild(tr);

    }

  // total de la cartera nacional / internacional

// Lee una tabla del dashboard (encabezados y filas visibles con sus clases)
function leerTabla(t) {

  const conLim = t.querySelectorAll('col:not(.cu):not(.esp)').length > 1 + 2 * n;
  const anchos = [...t.querySelectorAll('col:not(.cu):not(.esp)')].map((c) => parseFloat(c.style.width) || 60);
  const g = [...t.querySelectorAll('thead tr.g th:not(.cu)')];

    const cs = sinCu(tr);
    filas.push({
      sub: tr.classList.contains('sub'), big: tr.classList.contains('big'), sep: tr.classList.contains('sep'), det: tr.classList.contains('mm-det'),
      celdas: cs.map((td) => ({ txt: td.textContent.trim(), lim: td.classList.contains('lim'), alloc: td.classList.contains('alloc'), vacio: td.classList.contains('vacio') })),

// Dibuja la tabla dentro del área disponible, ajustando el alto de fila y la letra para que quepa en la lámina
// Medidas que necesita una tabla para caber en el área: alto de fila (h) y escala de anchos (k)
function pdfMedidas(T, anchoMax, altoMax) {
  const nData = T.filas.filter((f) => !f.gap).length, nGap = T.filas.filter((f) => f.gap).length;
  const h = Math.max(6.4, Math.min(12.5, (altoMax - 10 - 17) / Math.max(1, nData + 0.5 * (nGap + 1))));
  const huecos = (T.conLim ? 3 : 2) * 3, suma = T.anchos.reduce((a, b) => a + b, 0);
  const k = Math.min(0.75, (anchoMax - huecos) / suma);
  return { h, k };
}
function pdfTabla(doc, T, x0, y0, anchoMax, altoMax, comun) {

  const h = comun.h;
  const gapH = Math.min(6, h * 0.5);
  const tam = Math.max(6, Math.min(8, h * 0.66));
  const k = comun.k;
  const w = T.anchos.map((a, i) => a * k * (i >= 1 && i <= n ? 0.9 : 1)); // columnas de MONTO un poco más angostas
  const xs = []; let x = x0;
  w.forEach((wi, i) => { if (i === 1 || i === n + 1 || (T.conLim && i === 2 * n + 1)) x += GAP; xs.push(x); x += wi; });
  const xFinPc = xs[2 * n] + w[2 * n];
  const rect = (xx, yy, ww, hh, col) => { doc.setFillColor(...col); doc.rect(xx, yy, ww, hh, 'F'); };
  const centro = (txt, xx, ww, yy, hh) => doc.text(txt, xx + ww / 2, yy + hh / 2, { align: 'center', baseline: 'middle' });
  const ajustar = (txt, ancho) => { let s = txt; while (s.length > 3 && doc.getTextWidth(s) > ancho) s = s.slice(0, -2); return s === txt ? s : s.trimEnd() + '…'; };
  // --- encabezado ---
  let y = y0;
  rect(xs[0], y, w[0], hG + hA, PDF_C.pizarra);
  fnt(doc, 'b', 5.8, PDF_C.blanco); doc.text(T.labTxt, xs[0] + 5, y + (hG + hA) / 2, { baseline: 'middle' });
  const bloque = (i0, texto, color) => {
    const xx = xs[i0], ww = xs[i0 + n - 1] + w[i0 + n - 1] - xx;
    rect(xx, y, ww, hG + hA, color);
    doc.setDrawColor(255, 255, 255); doc.setLineWidth(0.5); doc.line(xx, y + hG, xx + ww, y + hG);
    fnt(doc, 'b', 5.6, PDF_C.blanco); centro(texto, xx, ww, y, hG);
    for (let j = 0; j < n; j++) {
      const lineas = T.alias[j].split('\n');
      fnt(doc, 'b', 5.2, PDF_C.blanco);
      const lh = 6;
      lineas.forEach((ln, li) => doc.text(ln, xs[i0 + j] + w[i0 + j] / 2, y + hG + hA / 2 + (li - (lineas.length - 1) / 2) * lh, { align: 'center', baseline: 'middle' }));
    }
  };
  bloque(1, T.montoTxt, PDF_C.pizarra);
  bloque(n + 1, T.pcTxt, [132, 151, 176]); // mismos azules que el dashboard (#5D7082 y #8497B0)
  if (T.conLim) {
    const i = 2 * n + 1;
    rect(xs[i], y, w[i], hG + hA, T.limAlloc ? PDF_C.verde : PDF_C.coral);
    fnt(doc, 'b', 5.6, PDF_C.blanco);
    T.limTxt.split('\n').forEach((ln, li, arr) => doc.text(ln, xs[i] + w[i] / 2, y + (hG + hA) / 2 + (li - (arr.length - 1) / 2) * 6.4, { align: 'center', baseline: 'middle' }));
  }
  y += hG + hA + gapH;
  // --- cuerpo ---
  for (const f of T.filas) {
    if (f.gap) { y += gapH; continue; }
    const negrita = f.sub || f.big;
    f.celdas.forEach((c, i) => {
      if (i >= w.length) return;
      let fondo = null;
      if (c.lim) fondo = c.vacio ? null : (c.alloc ? PDF_C.verdeFondo : PDF_C.coralFondo);
      else if (f.big) fondo = c.txt ? [214, 220, 226] : null;
      else if (f.sub) fondo = PDF_C.gris;
      if (fondo) rect(xs[i], y, w[i], h, fondo);
      if (!c.txt) return;
      fnt(doc, negrita || c.lim ? 'b' : 'l', tam, PDF_C.texto);
      if (i === 0) {
        const sang = f.det ? 12 : 5;
        doc.text(ajustar(c.txt, w[0] - sang - 3), xs[0] + sang, y + h / 2, { baseline: 'middle' });
      } else centro(c.txt, xs[i], w[i], y, h);
    });
    if (f.sep) { doc.setDrawColor(...PDF_C.pizarra); doc.setLineWidth(0.7); doc.setLineDashPattern([0.7, 1.2], 0); doc.line(xs[0], y, xFinPc, y); doc.setLineDashPattern([], 0); }
    y += h;
  }
  return y;
}

async function generarPDF() {
  if (!cliente || !datos || !window.jspdf) return;
  const bt = $('pdf-btn'); bt.disabled = true; const txt = bt.textContent; bt.textContent = 'Generando…';
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: [720, 405], compress: true });
    pdfFuentes(doc);
    const f = datos.fecha;
    const nombre = CLIENTES[cliente].nombre; // BUNEDER, FANTONI o FLAÑO
    const fechaLarga = f ? `${f.getDate()} ${MESES[f.getMonth()]} ${f.getFullYear()}` : '';
    const fuente = 'Fuente: MFO, Asset Allocation.';
    pdfPortada(doc, 'Control Carteras Espejo', nombre, fechaLarga);
    // el PDF va siempre sin custodios: si están desplegados, se arman las tablas sin ellos fuera de pantalla
    let tablas;
    if (verCustodio) {
      verCustodio = false;
      const tmp = el('div', { style: 'position:absolute;left:-20000px;top:0;visibility:hidden;width:1400px' }); document.body.appendChild(tmp);
      try {
        const c0 = CLIENTES[cliente];
        const cc = { ...c0, alias: c0.alias.filter((a) => verOpcional || !(c0.opcional || []).includes(a)) };
        const nn = construir(tmp, cc); aplicarAnchos(tmp, nn, anchosGlobales());
        tablas = [...tmp.querySelectorAll('table.r')].map(leerTabla);
      } finally { tmp.remove(); verCustodio = true; }
    } else tablas = [...$('vista').querySelectorAll('table.r')].map(leerTabla);
    const laminas = [
      ['Resumen Cartera', '', tablas[0], null],
      ['Resumen por Clase de Activo', '', tablas[1], null],
      ['Detalle por Productos', 'Cartera Nacional', tablas[2], 'No se muestran instrumentos con valor menor a USD 20.'],
      ['Detalle por Productos', 'Cartera Internacional', tablas[3], 'No se muestran instrumentos con valor menor a USD 20.'],
    ];
    const comun = laminas.filter((l) => l[2]).map(([, , T, nota]) => pdfMedidas(T, 595, nota ? 286 : 295))
      .reduce((a, b) => ({ h: Math.min(a.h, b.h), k: Math.min(a.k, b.k) }), { h: 12.5, k: 0.75 });
    // anchos en la misma proporción que en el dashboard respecto de la letra (12 px allá): tan compacto como en pantalla
    const tamPdf = Math.max(6, Math.min(8, comun.h * 0.66));
    comun.k = Math.min(comun.k, tamPdf / 12 * 1.05);
    laminas.forEach(([tit, sub, T, nota], i) => {
      if (!T) return;
      pdfLamina(doc, tit, sub, fuente, nota, i + 2);
      pdfTabla(doc, T, 64.8, 88, 595, (nota ? 286 : 295), comun);
    });
    const aammdd = f ? String(f.getFullYear()).slice(2) + String(f.getMonth() + 1).padStart(2, '0') + String(f.getDate()).padStart(2, '0') : '';
    const nombreArchivo = `${aammdd}_Control Carteras Espejo_${CLIENTES[cliente].nombre}.pdf`;
    // En Claude la descarga pasa por la capacidad "downloads" (el visor pide confirmación);
    // fuera de Claude (p. ej. GitHub Pages) se descarga directo desde el navegador.
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
    if (dl) {
      try { await dl.save({ filename: nombreArchivo, data: doc.output('blob') }); }
      catch (e) { if (e && e.code !== 'declined') alert('No se pudo descargar el PDF (' + (e.code || e.message || e) + ').'); }
    } else {
      doc.save(nombreArchivo);
    }
  } catch (e) {
    console.error(e); alert('No se pudo generar el PDF: ' + (e.message || e));
  } finally { bt.disabled = false; bt.textContent = txt; }
}

$('pdf-btn').addEventListener('click', generarPDF);
</script>
