:root{
  --font:'Aller','Fira Sans','Segoe UI',Helvetica,Arial,sans-serif;
  --mfo-green:#7BC143; --mfo-coral:#E07F5C; --mfo-dark:#1B2127; --mfo-blue-mid:#5D7082;
  --mfo-gray-mid:#969696; --mfo-gray-bg:#EFEFEF; --mfo-gray-hover:#E0E0E0;
  --bg:#FFFFFF; --surface:#FFFFFF; --fg:var(--mfo-dark); --muted:var(--mfo-gray-mid);
  --ok:#4E8E22; --bad:#C2502C; --badge:var(--mfo-coral);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14191E; --surface:#1A2026; --fg:#E4E8EB; --muted:#9AA3AB;
    --mfo-gray-bg:#252C33; --mfo-gray-hover:#323A42; --ok:#8BCB55; --bad:#EE906E; --badge:#EE906E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14191E; --surface:#1A2026; --fg:#E4E8EB; --muted:#9AA3AB;
  --mfo-gray-bg:#252C33; --mfo-gray-hover:#323A42; --ok:#8BCB55; --bad:#EE906E; --badge:#EE906E;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
body{font-family:var(--font);font-weight:300;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding:1.5rem}
button,input{font-family:var(--font)}
:focus-visible{outline:2px solid var(--mfo-green);outline-offset:2px}
[hidden]{display:none !important}

/* Encabezado tipo widget */
.widget-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:1rem}
.widget-title{font-size:22px;font-weight:700;color:var(--fg);line-height:1.2}
.widget-sub{font-size:14px;font-weight:300;color:var(--fg);margin-top:2px}
.widget-date{font-size:11.5px;color:var(--muted);margin-top:4px}
.widget-badge{text-align:right}
.solo-uso{font-size:12px;font-weight:700;color:var(--badge);text-transform:uppercase;letter-spacing:.06em}
.badge-actions{margin-top:8px}

/* Botones */
.mfo-btn{font-size:13px;font-weight:700;padding:7px 20px;border-radius:4px;border:1.5px solid var(--mfo-gray-mid);background:transparent;color:var(--mfo-blue-mid);cursor:pointer;transition:all .15s;white-space:nowrap}
.mfo-btn:hover{border-color:var(--mfo-blue-mid);color:var(--fg)}
.mfo-btn.small{font-size:11px;padding:5px 12px;color:var(--muted)}
.mfo-btn.small:hover{color:var(--mfo-blue-mid)}
.mfo-btn.primary{background:var(--mfo-green);border-color:var(--mfo-green);color:#fff}
.mfo-btn:disabled{opacity:.35;cursor:not-allowed}
.mfo-btn.primary:disabled{background:transparent;border-style:dashed;border-color:var(--mfo-gray-mid);color:var(--mfo-gray-mid);opacity:.6;cursor:not-allowed}

/* Tarjetas */
.item{border-radius:6px;overflow:hidden;margin-bottom:24px}
.item-header{padding:12px 22px;background:#E4E4E4;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.item-title{font-size:14px;font-weight:700;color:var(--fg)}
.item-date{font-size:11px;color:var(--muted)}
.item-body{padding:14px 22px 16px;background:var(--surface);border:1px solid var(--mfo-gray-bg);border-top:none;border-radius:0 0 6px 6px}

/* Carga */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:6px}
.slots .item{margin:0;transition:box-shadow .15s}
.slot.drag .item-body{box-shadow:inset 0 0 0 2px var(--mfo-green)}
.slot.ok .item-header{box-shadow:inset 4px 0 0 var(--mfo-green)}
.slot.err .item-header{box-shadow:inset 4px 0 0 var(--mfo-coral)}
.slot .desc{font-size:13px;font-weight:300;margin-bottom:12px}
.pick{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pick input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.pick input[type=file]:focus-visible + label{outline:2px solid var(--mfo-green);outline-offset:2px}
.pick label.mfo-btn{display:inline-block}
.pick span{font-size:11.5px;color:var(--muted)}
.status{font-size:12.5px;font-weight:400;min-height:1.5em;margin-top:10px}
.status.ok{color:var(--ok)}
.status.err{color:var(--bad)}
.status b{font-weight:700}
.actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:14px}
.note{font-size:11.5px;color:var(--muted)}
.placeholder{font-size:13px;color:var(--muted);padding:6px 0}
/* Selector de cliente (nombres ocultos hasta abrirlo) */
.toolbar{display:flex;align-items:center;gap:10px;margin:2px 0 18px}
.sel{position:relative}
.sel-btn{display:inline-flex;align-items:center;gap:8px;letter-spacing:.06em;text-transform:uppercase}
.sel-btn svg{transition:transform .15s}
.sel-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.sel-btn.is-set{background:var(--mfo-blue-mid);border-color:var(--mfo-blue-mid);color:#fff}
.menu{position:absolute;left:0;top:calc(100% + 6px);z-index:5;display:flex;flex-direction:column;gap:6px;min-width:190px;padding:8px;background:var(--surface);border:1px solid var(--mfo-gray-hover);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.menu .mfo-btn{text-align:left;letter-spacing:.06em}
.opc-btn{font-size:11.5px;padding:6px 14px;letter-spacing:.04em;border-style:dashed}
.opc-btn.is-on{border-style:solid;border-color:#5D7082;background:#EEF1F4;color:#5D7082}
.menu .ocultar{font-family:var(--font);font-size:12px;font-weight:300;text-align:left;padding:6px 12px 2px;border:0;border-top:1px solid var(--mfo-gray-hover);background:none;color:var(--muted);cursor:pointer}
.menu .ocultar:hover{color:var(--fg)}
.cli-info{font-size:12.5px;font-weight:400}
/* Tablas (paleta y pesos de la norma gráfica MFO) */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.r{border-collapse:collapse;table-layout:fixed;font-size:12px;font-weight:300;font-variant-numeric:tabular-nums;color:var(--fg)}
table.r th,table.r td{padding:3px 8px;white-space:nowrap;text-align:center}
table.r .lab{text-align:left;overflow:hidden;text-overflow:ellipsis}
/* en las filas Total Cartera, las celdas vacías van sin color (los subtotales grises se mantienen completos) */
table.r tr.big td:empty{background:transparent}
.nota-pie{font-size:11px;color:var(--muted);margin-top:12px}
/* Money market agrupado: fila resumen con botón y detalle desplegable con sangría */
.mm-toggle{appearance:none;border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.mm-toggle:hover{color:var(--mfo-blue-mid)}
.mm-toggle .mm-n{color:var(--muted)}
table.r tr.mm-det td.lab{padding-left:20px}
table.r .gl{border-left:4px solid var(--surface) !important}
table.r tbody td:not(.lab){padding-left:5px;padding-right:5px}
table.r.angosta tbody td:not(.lab){padding-left:3px;padding-right:3px}
table.r.angosta thead tr:not(.g) th{padding-left:3px;padding-right:3px}
table.r.prod tbody td.lab{white-space:normal;line-height:1.2}
table.r thead th{background:#5D7082;color:#fff;font-weight:700;font-size:10.5px;padding:3px 6px;line-height:1.15;border-left:0;letter-spacing:.02em}
table.r thead th:first-child{border-left:0}
table.r thead tr.g th{font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;height:18px}
/* línea que separa MONTO / % CARTERA de los nombres de los alias */
table.r thead tr.g th:not(.lab):not(.lim){border-bottom:1px solid rgba(255,255,255,.55)}
/* misma altura de encabezado en todos los clientes (alias en 1 o 2 líneas) */
table.r thead tr:not(.g) th{height:27px;padding:2px 6px;line-height:1.08;vertical-align:middle}
table.r thead th.pc{background:#8497B0}
table.r thead th.lim{background:#E07F5C;padding-left:3px;padding-right:3px;overflow:hidden}
table.r tbody td{border-bottom:0}
table.r td.g0{border-left:0}
table.r tr.sub td{background:#EBEBEB;font-weight:700}
table.r tr.big td{background:#D6DCE2;font-weight:700}
table.r tr.big td.lim,table.r tr.big td.vacio{background:transparent}
table.r tr.sep td{border-top:2px dotted #5D7082}
table.r tr.gap td{height:10px;padding:0;border:0;background:transparent}
table.r td.lim{background:#FBE5DB;color:var(--mfo-dark);font-weight:700}
table.r td.lim.vacio{background:transparent}
table.r tr.sub td.lim{background:transparent}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) table.r td.lim:not(.vacio){background:#4A2E25;color:#EAA992}}
:root[data-theme="dark"] table.r td.lim:not(.vacio){background:#4A2E25;color:#EAA992}
/* Allocation MFO en verde (norma: verde base en el encabezado, verde fondo #E1F1D3 en las celdas) para distinguirla del límite neutral naranjo */
table.r thead th.lim.alloc{background:#7BC143}
table.r td.lim.alloc{background:#E1F1D3;color:var(--mfo-dark)}
table.r td.lim.alloc.vacio,table.r tr.sub td.lim.alloc,table.r tr.big td.lim.alloc{background:transparent}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) table.r td.lim.alloc:not(.vacio){background:#2E4220;color:#B3D88C}}
:root[data-theme="dark"] table.r td.lim.alloc:not(.vacio){background:#2E4220;color:#B3D88C}
.cli-info b{font-weight:700}
.cli-info.err{color:var(--bad)}
</style>
</head>
<body>
<main class="wrap">

  <div id="upload">
    <div class="widget-header">
      <div>
        <h1 class="widget-title">Cuentas Espejo</h1>
        <div class="widget-sub">Carga el archivo de descarga Asset Allocation.</div>
      </div>
      <div class="widget-badge"><div class="solo-uso">Solo uso interno</div></div>
    </div>
    <div class="slots">
      <div class="slot" id="slot-aa">
        <div class="item">
          <div class="item-header"><span class="item-title">Allocation</span><span class="item-date">Descarga Asset Allocation</span></div>
          <div class="item-body">
            <p class="desc">Detalle de posiciones en CLP y USD.</p>
            <div class="pick">
              <input type="file" id="f-aa" accept=".xlsx,.xls,.xlsm">
              <label for="f-aa" class="mfo-btn">Elegir archivo</label><span>o arrástralo aquí</span>
            </div>
            <div class="status" id="s-aa" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="mfo-btn primary" id="go" disabled>Ver Cuentas Espejo</button>
      <span class="note">El archivo se lee en tu navegador; no se envía a ningún servidor.</span>
    </div>
  </div>

  <div id="dash" hidden>
    <div class="widget-header">
      <div>
        <h1 class="widget-title">Cuentas Espejo</h1>
        <div class="widget-date" id="d-date"></div>
      </div>
      <div class="widget-badge">
        <div class="solo-uso">Solo uso interno</div>
      </div>
    </div>
    <div class="toolbar">
      <div class="sel" id="selector">
        <button type="button" class="mfo-btn sel-btn" id="sel-btn" aria-haspopup="true" aria-expanded="false"><span id="sel-txt">Cliente</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg></button>
        <div class="menu" id="sel-menu" role="menu" hidden>
          <button type="button" class="mfo-btn" role="menuitem" data-cliente="buneder">BUNEDER</button>
          <button type="button" class="mfo-btn" role="menuitem" data-cliente="fantoni">FANTONI</button>
          <button type="button" class="mfo-btn" role="menuitem" data-cliente="flano">FLAÑO</button>
          <button type="button" class="ocultar" role="menuitem" data-cliente="">Ocultar cliente</button>
        </div>
      </div>
      <button type="button" class="mfo-btn opc-btn" id="opc-btn" aria-pressed="false" hidden></button>
    </div>
    <div id="vista"></div>
  </div>

</main>
<script>
"use strict";
// ================= Lectura del Asset Allocation (todo en el navegador) =================
const COLS = ['Alias', 'Nombre Cliente', 'Clase Activo', 'Sub Tipo Instrumento', 'Región', 'Moneda Riesgo', 'Tipo Instrumento', 'Nombre', 'Valor en CLP', 'Valor en USD', 'Fecha'];
let archivo = null, datos = null;

const $ = (id) => document.getElementById(id);
const slot = $('slot-aa'), st = $('s-aa');
function estado(cls, html) { slot.classList.remove('ok', 'err'); if (cls) slot.classList.add(cls); st.className = 'status ' + (cls || ''); st.innerHTML = html; }

function abrir(bytes) {
  return XLSX.read(bytes, { type: 'array', cellDates: true });
}

function leerAA(wb) {
  for (const nombre of wb.SheetNames) {
    const filas = XLSX.utils.sheet_to_json(wb.Sheets[nombre], { header: 1, raw: true, defval: null });
    const hi = filas.findIndex((f) => f && f.includes('Alias') && f.includes('Clase Activo'));
    if (hi < 0) continue;
    const cab = filas[hi];
    const falta = COLS.filter((c) => !cab.includes(c));
    if (falta.length) throw new Error('faltan columnas: ' + falta.join(', '));
    const ix = Object.fromEntries(COLS.map((c) => [c, cab.indexOf(c)]));
    const pos = [];
    for (const f of filas.slice(hi + 1)) {
      if (!f || !f[ix['Alias']]) continue;
      const o = {}; for (const c of COLS) o[c] = f[ix[c]];
      pos.push(o);
    }
    if (!pos.length) throw new Error('la hoja no tiene posiciones');
    const aFecha = (v) => {
      if (v instanceof Date) return v;
      if (typeof v === 'number') return new Date(Math.round((v - 25569) * 864e5));
      const m = String(v || '').match(/(\d{4})-(\d{2})-(\d{2})|(\d{2})[-\/](\d{2})[-\/](\d{4})/);
      if (!m) return null;
      return m[1] ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(+m[6], +m[5] - 1, +m[4]);
    };
    const fechas = pos.map((p) => aFecha(p['Fecha'])).filter((d) => d && !isNaN(d)).sort((a, b) => b - a);
    return { hoja: nombre, posiciones: pos, alias: new Set(pos.map((p) => p['Alias'])).size, fecha: fechas[0] || null };
  }
  throw new Error('no se encontró la tabla de posiciones (columnas Alias y Clase Activo)');
}

const fmtFecha = (d) => d ? d.toLocaleDateString('es-CL', { day: '2-digit', month: '2-digit', year: 'numeric' }) : 's/f';
const nf = new Intl.NumberFormat('es-CL');

async function procesar() {
  datos = null; $('go').disabled = true;
  estado('', 'Leyendo <b>' + archivo.name + '</b>…');
  try {
    const bytes = new Uint8Array(await archivo.arrayBuffer());
    const wb = abrir(bytes);
    datos = leerAA(wb);
    estado('ok', '✓ <b>' + archivo.name + '</b> · datos al ' + fmtFecha(datos.fecha));
    $('go').disabled = false;
  } catch (e) {
    estado('err', 'No pude leer el archivo: ' + (e.message || e) + '.');
  }
}

function elegir(f) { if (!f) return; archivo = f; procesar(); }
$('f-aa').addEventListener('change', (e) => elegir(e.target.files[0]));
const caja = slot.querySelector('.item');
caja.addEventListener('dragover', (e) => { e.preventDefault(); slot.classList.add('drag'); });
caja.addEventListener('dragleave', () => slot.classList.remove('drag'));
caja.addEventListener('drop', (e) => { e.preventDefault(); slot.classList.remove('drag'); elegir(e.dataTransfer.files[0]); });

$('go').addEventListener('click', () => {
  if (!datos) return;
  $('d-date').textContent = 'Asset Allocation al ' + fmtFecha(datos.fecha);
  elegirCliente('');
  $('upload').hidden = true; $('dash').hidden = false; window.scrollTo(0, 0);
});
// ================= Clientes =================
const CLIENTES = {
  // BUNEDER: solo personas naturales (se excluyen sociedades del mismo alias, como Inversiones Magnolia SpA)
  buneder: { nombre: 'BUNEDER', alias: ['BUN-PATRICIA', 'BUN-NICOLE', 'BUN-CAROLINA'], soloNaturales: true,
    limite: { RF: 0.65, RV: 0.30, ALT: 0.05, USD: 0.70, CLP: 0.30 } },
  // FANTONI-JOSETOMAS va agrupado (oculto) al abrir; con el botón se incorpora a todas las tablas
  fantoni: { nombre: 'FANTONI', alias: ['FANTONI-CRESCENTE', 'FANTONI-LAURA', 'FANTONI-MATEO', 'FANTONI-JOSETOMAS'], opcional: ['FANTONI-JOSETOMAS'],
    limite: { RF: 0.45, RV: 0.50, ALT: 0.05, USD: 0.75, CLP: 0.25 } },
  flano: { nombre: 'FLAÑO', alias: ['CFLAÑO', 'JFLAÑO', 'PFLAÑO'],
    limite: { RF: 0.55, RV: 0.30, ALT: 0.15, USD: 0.50, CLP: 0.50 } },
};
const esSociedad = (t) => /\b(SpA|S\.A\.?|Ltda\.?|Limitada|Inversiones)\b/i.test(t || '');
// Clase de cada posición: la caja va a renta fija de su mercado; CLP = clases nacionales, USD = internacionales
function clasificar(p) {
  const ca = String(p['Clase Activo'] || '');
  // Pershing Square Holdings se trata como acción de renta variable internacional (EE.UU.), aunque el AA lo traiga en ALTI
  const pershing = /Pershing Square Holdings/i.test(String(p['Nombre'] || ''));
  if (pershing) p = { ...p, 'Clase Activo': 'RVI', 'Región': 'Norteamérica', 'Tipo Instrumento': 'Acciones' };
  const clase = { CASHI: 'RFI', CASHN: 'RFN' }[pershing ? 'RVI' : ca] || (pershing ? 'RVI' : ca);
  const sub = String(p['Sub Tipo Instrumento'] || '');
  let grupo;
  if (clase === 'RFN') grupo = p['Moneda Riesgo'] === 'UF' ? 'UF' : 'CLP';
  else if (clase === 'RVN') grupo = ['Acciones', 'ETF'].includes(p['Tipo Instrumento']) ? 'Acciones' : 'Fondos Mutuos y Otros';
  else if (clase === 'RFI') grupo = (ca === 'CASHI' || ['Money Market', 'Otros', 'Depósitos', ''].includes(sub)) ? 'Caja y Money Market' : sub === 'Emerging Market Debt' ? 'Emerging Market Debt' : sub;
  else if (clase === 'RVI') grupo = { 'Norteamérica': 'Estados Unidos', 'Europa': 'Europa', 'Japón': 'Japón', 'Asia': 'Japón', 'Global Emergente': 'Global Emergente', 'Asia Emergente': 'Global Emergente', 'Latinoamérica': 'Global Emergente', 'Europa Emergente': 'Global Emergente', 'Global': 'Global' }[p['Región']] || 'Global';
  else grupo = sub || 'Otros';
  return { clase, macro: clase.slice(0, -1), mercado: clase.endsWith('N') ? 'CLP' : 'USD', grupo, caja: ca === 'CASHI' || ca === 'CASHN', accion: p['Tipo Instrumento'] === 'Acciones', mm: /Money Market/i.test(sub) || /Money Market|Liquidez/i.test(String(p['Nombre'] || '')), instrumento: p['Nombre'], usd: Number(p['Valor en USD']) || 0, clp: Number(p['Valor en CLP']) || 0 };
}
const pct = (v) => { if (v == null || !isFinite(v)) return ''; let x = v * 100; if (Math.abs(x) < 0.05) x = 0; return x.toFixed(1).replace('.', ',').replace('-', '\u2212') + '%'; };
const money = (v) => (v == null || !isFinite(v) || Math.round(v) === 0 ? '' : nf.format(Math.round(v)));
function el(tag, attrs, text) { const e = document.createElement(tag); for (const k in attrs || {}) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; }
let cliente = null;
function abrirMenu(si) { $('sel-menu').hidden = !si; $('sel-btn').setAttribute('aria-expanded', String(si)); }
let verOpcional = false;
const mmAbierto = new Set(); // grupos de money market desplegados (se mantienen al cambiar de cliente o de vista)
function elegirCliente(k) {
  cliente = CLIENTES[k] ? k : null;
  verOpcional = false;
  $('sel-txt').textContent = cliente ? CLIENTES[cliente].nombre : 'Cliente';
  $('sel-btn').classList.toggle('is-set', !!cliente);
  abrirMenu(false);
  vistaCliente();
}
function vistaCliente() {
  const v = $('vista'); v.replaceChildren();
  if (!cliente || !datos) { $('opc-btn').hidden = true; return; } // sin cliente elegido la vista queda en blanco
  const c0 = CLIENTES[cliente];
  // alias opcionales (agrupados): fuera de todas las tablas y cálculos hasta que se abren con el botón
  const ob = $('opc-btn');
  ob.hidden = !c0.opcional;
  if (c0.opcional) {
    ob.textContent = (verOpcional ? '− ' : '+ ') + c0.opcional.join(', ');
    ob.setAttribute('aria-pressed', String(verOpcional)); ob.classList.toggle('is-on', verOpcional);
    ob.title = verOpcional ? 'Quitar de la vista' : 'Incluir en la vista';
  }
  const c = { ...c0, alias: c0.alias.filter((a) => verOpcional || !(c0.opcional || []).includes(a)) };
  const n = construir(v, c);
  aplicarAnchos(v, n, anchosGlobales());
}
// Arma los tres paneles de un cliente (con sus alias visibles) dentro de v; devuelve la cantidad de alias
function construir(v, c) {
  const faltan = c.alias.filter((a) => !datos.posiciones.some((p) => p['Alias'] === a));
  if (faltan.length) { v.appendChild(el('p', { class: 'cli-info err' }, 'No encontré en el archivo: ' + faltan.join(', ') + '.')); }
  // posiciones por alias, ya clasificadas
  const porAlias = c.alias.map((a) => datos.posiciones
    .filter((p) => p['Alias'] === a && !(c.soloNaturales && esSociedad(p['Nombre Cliente'])))
    .map(clasificar));
  v.appendChild(tarjeta('Resumen Cartera', tablaResumen(c, porAlias)));
  v.appendChild(tarjeta('Resumen por Clase de Activo', tablaClase(c, porAlias)));
  const prod = el('div');
  prod.appendChild(tablaProductos(c, porAlias, true));
  prod.appendChild(el('div', { style: 'height:22px' }));
  prod.appendChild(tablaProductos(c, porAlias, false));
  prod.appendChild(el('p', { class: 'nota-pie' }, 'No se muestran instrumentos con valor menor a USD 20.'));
  v.appendChild(tarjeta('Detalle por Productos', prod));
  return c.alias.length;
}
// Anchos comunes a TODOS los clientes (y con o sin los alias agrupados), para que las columnas no cambien de tamaño al
// pasar de un cliente a otro. Se miden una vez por archivo, armando cada cliente fuera de pantalla.
let anchosCache = null, anchosDe = null;
function anchosGlobales() {
  if (anchosCache && anchosDe === datos) return anchosCache;
  const tmp = el('div', { style: 'position:absolute;left:-20000px;top:0;visibility:hidden;width:1400px' });
  document.body.appendChild(tmp);
  let g = null;
  for (const k of Object.keys(CLIENTES)) {
    const c0 = CLIENTES[k];
    for (const conOpc of c0.opcional ? [false, true] : [false]) {
      const c = { ...c0, alias: c0.alias.filter((a) => conOpc || !(c0.opcional || []).includes(a)) };
      tmp.replaceChildren();
      const nn = construir(tmp, c);
      tmp.querySelectorAll('tr.mm-det').forEach((r) => { r.hidden = false; }); // se mide también el detalle de money market
      const m = medirAnchos(tmp, nn);
      g = !g ? m : { lab: Math.max(g.lab, m.lab), labProd: Math.max(g.labProd, m.labProd), pc: Math.max(g.pc, m.pc), am: g.am.map((x, i) => Math.max(x, m.am[i] || 0)) };
    }
  }
  tmp.remove();
  anchosCache = g; anchosDe = datos;
  return g;
}

      const tr = el('tr');
      if (agrupar && esMM(nm)) { tr.className = 'mm-det'; tr.dataset.mm = cl; tr.hidden = !mmAbierto.has(claveMM); }
      tr.appendChild(el('td', { class: 'lab', title: nm }, nm.replace(/\(UNICA\)/g, '(Unica)'))); // serie única en minúsculas para que el nombre quepa
      m.forEach((x) => tr.appendChild(el('td', {}, money(x))));
      u.forEach((x, i) => tr.appendChild(el('td', {}, Math.round(m[i]) ? pct(totUsd[i] ? x / totUsd[i] : 0) : '')));
      tb.appendChild(tr);
    }
    // subtotal de la clase (monto en su moneda y % sobre la cartera total del alias)
    filaTotal(TOTALES[cl], porAlias.map((rs) => rs.filter((r) => r.clase === cl)), 'sub');
  });
  // total de la cartera nacional / internacional
  gap();
  filaTotal(nacional ? 'Total Cartera Nacional (en CLP)' : 'Total Cartera Internacional (en USD)', porAlias.map((rs) => rs.filter((r) => clases.includes(r.clase))), 'big');
  t.appendChild(tb);
  return t;
  function filaTotal(etq, rsAlias, cls) {
    const tr = el('tr', { class: cls });
    tr.appendChild(el('td', { class: 'lab' }, etq));
    const m = rsAlias.map((rs) => rs.reduce((s2, r) => s2 + r[campo], 0));
    const u = rsAlias.map((rs) => rs.reduce((s2, r) => s2 + r.usd, 0));
    m.forEach((x) => tr.appendChild(el('td', {}, money(x))));
    u.forEach((x, i) => tr.appendChild(el('td', {}, Math.round(m[i]) ? pct(totUsd[i] ? x / totUsd[i] : 0) : '')));
    tb.appendChild(tr);
  }
}

$('opc-btn').addEventListener('click', () => { verOpcional = !verOpcional; vistaCliente(); });
$('sel-btn').addEventListener('click', (e) => { e.stopPropagation(); abrirMenu($('sel-menu').hidden); });
$('sel-menu').addEventListener('click', (e) => { const b = e.target.closest('[data-cliente]'); if (b) elegirCliente(b.dataset.cliente); });
document.addEventListener('click', (e) => { if (!e.target.closest('#selector')) abrirMenu(false); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') abrirMenu(false); });

</script>
